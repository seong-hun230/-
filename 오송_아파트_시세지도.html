<title>오송 아파트 시세지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: full-bleed pan/zoom map, floating filter chips on top, tool rail on the right, detail sheet on the left (bottom on phones). */
:root {
  --land:#f2f1ee; --block:#e9e7e2; --bldg:#dbd7cf; --street:#ffffff; --road:#ffffff; --road-case:#d8d5ce;
  --cgrid:#f4e2d8; --zgrid:#e7e9ee; --zone-line:#7a5af0; --park:#d5e9cf; --field:#e4eedb; --school:#dce7f5;
  --station:#dce2eb; --rail:#a3a9b2; --ktx:#7b95b2; --rail-gap:#f2f1ee; --sel:#d9cffb;
  --ink:#1b1f24; --ink-2:#4a515a; --ink-3:#7a818a; --panel:#ffffff; --panel-2:#f5f6f7; --line:#e2e4e7;
  --navy:#1c2a3a; --on-navy:#ffffff; --green:#0f9f55; --green-soft:#e4f6ec; --blue:#2c67d1; --blue-soft:#e8effc;
  --violet:#6a43e3; --violet-soft:#efe9ff; --amber:#a86a12; --amber-soft:#fcf1de;
  --shadow:0 2px 8px rgba(20,30,40,.18); --veil:rgba(255,255,255,.82);
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --land:#1c2025; --block:#242a30; --bldg:#2f363e; --street:#2b3037; --road:#3a4048; --road-case:#22262b;
  --cgrid:#2e2a2b; --zgrid:#262a33; --zone-line:#a08bff; --park:#1e3025; --field:#1f2922; --school:#1f2a39;
  --station:#2d3542; --rail:#6b737d; --ktx:#5f7d9d; --rail-gap:#1c2025; --sel:#3a3160;
  --ink:#eef1f4; --ink-2:#c2c8cf; --ink-3:#8c949d; --panel:#1f242a; --panel-2:#272d34; --line:#353c44;
  --navy:#2d4058; --on-navy:#ffffff; --green:#37d184; --green-soft:#16342a; --blue:#6f9fff; --blue-soft:#1a2a46;
  --violet:#a891ff; --violet-soft:#2a2348; --amber:#e3ac52; --amber-soft:#3a2c15;
  --shadow:0 2px 10px rgba(0,0,0,.5); --veil:rgba(28,32,37,.85); color-scheme:dark;
}}
:root[data-theme="dark"] {
  --land:#1c2025; --block:#242a30; --bldg:#2f363e; --street:#2b3037; --road:#3a4048; --road-case:#22262b;
  --cgrid:#2e2a2b; --zgrid:#262a33; --zone-line:#a08bff; --park:#1e3025; --field:#1f2922; --school:#1f2a39;
  --station:#2d3542; --rail:#6b737d; --ktx:#5f7d9d; --rail-gap:#1c2025; --sel:#3a3160;
  --ink:#eef1f4; --ink-2:#c2c8cf; --ink-3:#8c949d; --panel:#1f242a; --panel-2:#272d34; --line:#353c44;
  --navy:#2d4058; --on-navy:#ffffff; --green:#37d184; --green-soft:#16342a; --blue:#6f9fff; --blue-soft:#1a2a46;
  --violet:#a891ff; --violet-soft:#2a2348; --amber:#e3ac52; --amber-soft:#3a2c15;
  --shadow:0 2px 10px rgba(0,0,0,.5); --veil:rgba(28,32,37,.85); color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--land);color:var(--ink);font-family:var(--font);overflow:hidden}
button,select{font-family:inherit;color:inherit}
button:focus-visible,select:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.app{position:relative;height:100%;overflow:hidden}

/* map */
#map{position:absolute;inset:0;touch-action:none;cursor:grab;background:var(--land)}
#map.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:1600px;height:1100px;transform-origin:0 0;--inv:1}
#base{position:absolute;inset:0;width:1600px;height:1100px;display:block}
.land{fill:var(--land)} .blk{fill:var(--block)} .bldg{fill:var(--bldg)} .street{fill:var(--street)}
.cgrid{fill:var(--cgrid)} .zgrid{fill:var(--zgrid)} .park{fill:var(--park)} .field{fill:var(--field)}
.school{fill:var(--school)} .station{fill:var(--station);stroke:var(--ktx);stroke-width:2}
.road-case{fill:none;stroke:var(--road-case);stroke-linecap:round;stroke-linejoin:round}
.road{fill:none;stroke:var(--road);stroke-linecap:round;stroke-linejoin:round}
.rail{fill:none;stroke:var(--rail);stroke-width:6;stroke-linejoin:round}
.ktx{fill:none;stroke:var(--ktx);stroke-width:6;stroke-linejoin:round}
.rail-gap{fill:none;stroke:var(--rail-gap);stroke-width:2.6;stroke-dasharray:11 9;stroke-linejoin:round}
.zone{fill:none;stroke:var(--zone-line);stroke-width:2.5;stroke-dasharray:10 7;opacity:.75}
.zone-on .zone{opacity:1;stroke-width:4}
.zone-fill{fill:var(--zone-line);opacity:0}
.zone-on .zone-fill{opacity:.08}
.area{fill:var(--block);stroke:var(--road-case);stroke-width:1.5;transition:fill .2s}
.area.sel{fill:var(--sel);stroke:var(--violet);stroke-width:3}
.area.dim{opacity:.45}
.rail-label{font:500 15px var(--font);fill:var(--ink-3);letter-spacing:.06em}

/* counter-scaled pins */
.pin{position:absolute;width:0;height:0;transform:scale(var(--inv));transform-origin:0 0}
.mk{position:absolute;left:0;bottom:7px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;
  border:0;background:none;padding:0;cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.22))}
.mk::after{content:"";width:0;height:0;border:6px solid transparent;border-top-color:var(--navy);border-bottom:0;margin-top:-1px}
.mk-tag{background:var(--navy);color:var(--on-navy);font-size:11px;font-weight:500;line-height:1;padding:4px 7px 3px;border-radius:5px 5px 0 0}
.mk-body{background:var(--panel);border:1.5px solid var(--navy);border-radius:6px;padding:4px 9px;font-size:14px;font-weight:800;
  white-space:nowrap;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--ink)}
.mk-body em{font-style:normal;font-weight:700;margin-right:4px}
.sale .mk-body em{color:var(--green)} .rent .mk-body em{color:var(--blue)} .plan .mk-body em{color:var(--violet)}
.plan .mk-tag{background:var(--violet)} .plan .mk-body{border-color:var(--violet);background:var(--violet-soft)} .plan.mk::after{border-top-color:var(--violet)}
.mk.on .mk-body{outline:3px solid var(--violet);outline-offset:1px}
.mk.stale .mk-tag::after{content:" ·25년";opacity:.8}
.poi{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;display:flex;align-items:center;gap:4px;
  font-size:12px;font-weight:500;color:var(--ink-2);pointer-events:none;
  text-shadow:0 0 3px var(--land),0 0 3px var(--land),0 0 2px var(--land)}
.poi svg{flex:none}
.poi.apt{font-size:12.5px;color:var(--ink);font-weight:700;flex-direction:column;gap:1px;text-align:center}
.poi.zone-t{font-size:17px;font-weight:800;color:var(--zone-line);line-height:1.25;text-align:center;flex-direction:column}
.poi.station-t{font-size:14px;font-weight:800;color:var(--ink);flex-direction:column;gap:2px}
.poi .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--panel);box-shadow:var(--shadow)}
.edu-off .poi.edu{display:none}
.far .poi.apt{display:none}
.narrow .pin.m{transform:scale(calc(var(--inv) * .8))}
.hide{display:none}

/* popup */
.pop{position:absolute;left:0;bottom:66px;transform:translateX(-50%);width:244px;background:var(--panel);border-radius:10px;
  box-shadow:0 6px 22px rgba(0,0,0,.25);overflow:hidden;cursor:default}
.pop-h{background:var(--navy);color:var(--on-navy);display:flex;align-items:center;gap:6px;padding:10px 8px 10px 14px}
.pop-h strong{flex:1;min-width:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-h button{border:0;background:none;color:var(--on-navy);font-size:18px;line-height:1;cursor:pointer;padding:2px 6px}
.pop-b{padding:12px 14px 12px;display:grid;gap:4px}
.pop-price{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.pop-price em{font-style:normal;margin-right:6px;font-weight:700;font-size:15px}
.pop-sub{font-size:12px;color:var(--ink-3)}
.pop-note{font-size:12px;color:var(--ink-2)}
.pop-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 10px 10px}
.pop-btns button{border:0;background:var(--panel-2);border-radius:6px;padding:7px 0;font-size:12.5px;cursor:pointer}
.pop-btns button:hover{background:var(--line)}

/* chrome */
.top{position:absolute;left:12px;right:64px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;overflow-x:auto;
  scrollbar-width:none;padding:2px;z-index:5}
.top::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;display:inline-flex;align-items:center;gap:6px;padding:0 15px;border-radius:20px;background:var(--panel);
  border:1px solid var(--line);box-shadow:var(--shadow);font-size:14.5px;font-weight:500;white-space:nowrap}
.chip.loc{font-weight:700;gap:8px}
.seg{flex:none;display:inline-flex;height:40px;border-radius:20px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:17px;padding:0 13px;font-size:14px;font-weight:500;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);font-weight:700}
select.chip{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:32px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 17px) 17px,calc(100% - 12px) 17px;background-size:5px 5px;background-repeat:no-repeat}
.rail-tools{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
.tool{width:48px;min-height:52px;border:1px solid var(--line);background:var(--panel);border-radius:10px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;cursor:pointer;padding:5px 0}
.tool svg{width:20px;height:20px}
.tool[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.tool.brand{background:var(--green);color:#fff;border-color:var(--green);font-weight:700;border-radius:50%;width:48px;min-height:48px;font-size:12px}
.count{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;
  background:var(--panel);border:1.5px solid var(--green);border-radius:30px;box-shadow:var(--shadow);height:52px;padding:0 6px;z-index:4}
.count span{padding:0 18px;font-size:15px;font-weight:700;white-space:nowrap}
.count b{color:var(--green);font-weight:800;margin-left:6px;font-variant-numeric:tabular-nums}
.count i{width:1px;height:22px;background:var(--line)}
.zoom{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:4}
.zoom .grp{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.zoom button{width:46px;height:46px;border:0;background:none;font-size:24px;cursor:pointer;display:grid;place-items:center}
.zoom .solo{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.attrib{position:absolute;left:0;right:0;bottom:0;padding:4px max(10px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px));
  font-size:10.5px;color:var(--ink-3);text-align:right;background:var(--veil);z-index:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;
  background:var(--veil);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--ink-2);z-index:3}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px}

/* side sheet */
.sheet{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(64px + env(safe-area-inset-top,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));
  width:360px;max-width:calc(100% - 84px);background:var(--panel);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.22);z-index:6;
  display:flex;flex-direction:column;overflow:hidden}
.sh-h{display:flex;align-items:flex-start;gap:8px;padding:16px 12px 12px 18px;border-bottom:1px solid var(--line)}
.sh-h h2{flex:1;min-width:0;margin:0;font-size:18px;font-weight:800;line-height:1.35;text-wrap:balance}
.sh-h button{border:0;background:var(--panel-2);border-radius:8px;width:32px;height:32px;font-size:18px;cursor:pointer;flex:none}
.sh-c{overflow-y:auto;padding:14px 18px 20px;display:grid;gap:14px;align-content:start}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:500;padding:3px 8px;border-radius:5px;background:var(--panel-2);color:var(--ink-2)}
.tag.sale{background:var(--green-soft);color:var(--green)} .tag.rent{background:var(--blue-soft);color:var(--blue)}
.tag.plan{background:var(--violet-soft);color:var(--violet)} .tag.warn{background:var(--amber-soft);color:var(--amber)}
.big{display:grid;gap:2px}
.big .lbl{font-size:12.5px;color:var(--ink-3)}
.big .val{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big .val em{font-style:normal;font-size:16px;margin-right:6px}
.big .rng{font-size:13px;color:var(--ink-2)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:10px 0;font-size:14px;cursor:pointer;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--ink-3);font-size:12px}
td.r,th.r{text-align:right;white-space:nowrap}
td.r{font-weight:700}
dl{margin:0;display:grid;grid-template-columns:88px 1fr;gap:8px 10px;font-size:13.5px}
dt{color:var(--ink-3)} dd{margin:0;min-width:0}
ul.notes{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13px;color:var(--ink-2);line-height:1.55}
ul.src{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:13px}
ul.src a{color:var(--blue);word-break:break-all}
.empty{font-size:13px;color:var(--ink-3);background:var(--panel-2);border-radius:8px;padding:12px}
.h3{font-size:13px;font-weight:700;color:var(--ink-2);margin:2px 0 -4px}

/* compare chart */
.cmp{display:grid;gap:12px}
.cmp-row{display:grid;gap:4px}
.cmp-name{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.cmp-name b{font-variant-numeric:tabular-nums;white-space:nowrap}
.cmp-name small{color:var(--ink-3);font-size:11.5px}
.bar{position:relative;height:14px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.bar i.sale{background:var(--green)} .bar i.rent{background:var(--blue)} .bar i.plan{background:var(--violet)}
.bar i.ext{background:repeating-linear-gradient(135deg,var(--violet) 0 3px,transparent 3px 7px);opacity:.55;border-radius:0 4px 4px 0}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

@media (max-width:700px){
  .sheet{left:0;right:0;top:auto;bottom:0;width:auto;max-width:none;max-height:64%;border-radius:16px 16px 0 0;
    padding-bottom:env(safe-area-inset-bottom,0px)}
  .legend{display:none}
  .count{height:44px} .count span{padding:0 12px;font-size:13.5px}
  .zoom button{width:42px;height:42px}
  .chip,.seg{height:38px}
  .tool{width:44px;min-height:48px;font-size:11px}
  .tool.brand{width:44px;min-height:44px}
}
@media (prefers-reduced-motion: reduce){#world{transition:none!important}}
</style>

<div class="app" id="app">
  <div id="map" aria-label="오송역 주변 아파트 시세 지도">
    <div id="world">
      <svg id="base" viewBox="0 0 1600 1100" aria-hidden="true"></svg>
      <div id="pois"></div>
      <div id="markers"></div>
      <div id="popLayer"></div>
    </div>
  </div>

  <div class="top">
    <span class="chip loc">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c-3.9 0-7 3.1-7 7 0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" fill="currentColor"/></svg>
      청주시 흥덕구 오송읍
    </span>
    <div class="seg" role="group" aria-label="단지 구분">
      <button type="button" data-f="all" aria-pressed="true">전체</button>
      <button type="button" data-f="sale" aria-pressed="false">매매</button>
      <button type="button" data-f="rent" aria-pressed="false">임대</button>
      <button type="button" data-f="plan" aria-pressed="false">공급예정</button>
    </div>
    <select class="chip" id="mode" aria-label="지도 표시 기준">
      <option value="price">실거래가</option>
      <option value="units">세대수</option>
      <option value="year">입주연도</option>
    </select>
  </div>

  <div class="rail-tools">
    <button type="button" class="tool brand" id="btnCmp" aria-pressed="false" title="단지별 가격 비교">비교</button>
    <button type="button" class="tool" id="btnEdu" aria-pressed="true" title="학교 표시">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3zm-6.8 9.2V16c0 1.7 3 3.5 6.8 3.5s6.8-1.8 6.8-3.5v-3.8L12 16l-6.8-3.8z" fill="currentColor"/></svg>교육</button>
    <button type="button" class="tool" id="btnDev" aria-pressed="false" title="도시개발구역 강조">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 21h16L12 2zm0 5.5 4.6 11.5H7.4L12 7.5z" fill="currentColor"/></svg>개발</button>
    <button type="button" class="tool" id="btnInfo" aria-pressed="false" title="자료 출처와 유의사항">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 10.5h2V17h-2zM11 7h2v2h-2z" fill="currentColor"/></svg>안내</button>
  </div>

  <div class="legend" aria-hidden="true">
    <span><i style="background:var(--green)"></i>매매 실거래</span>
    <span><i style="background:var(--blue)"></i>임대(전세·보증금)</span>
    <span><i style="background:var(--violet)"></i>공급 예정</span>
  </div>

  <div class="count">
    <span>단지<b id="cnt">9</b></span><i></i><span>2026.10.14 기준</span>
  </div>

  <div class="zoom">
    <div class="grp">
      <button type="button" id="zin" aria-label="확대">+</button>
      <button type="button" id="zout" aria-label="축소">−</button>
    </div>
    <button type="button" class="solo" id="zfit" aria-label="처음 화면으로">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5" stroke="currentColor" stroke-width="2"/></svg>
    </button>
  </div>

  <div class="attrib">브리핑용 개략도 · 위치·도로는 실제와 다를 수 있음 · 시세: 국토부 실거래가 재가공 자료(호갱노노·리치고·KB부동산 등)</div>

  <aside class="sheet" id="sheet" hidden></aside>
</div>

<script>

function renderMarkers() {
  mkLayer.innerHTML = '';

  DATA.forEach(c => {
    const show = state.filter === 'all' || state.filter === c.kind;
    areaEl[c.id].classList.toggle('dim', !show);
    document.querySelector('#pois .pin[data-id="'+c.id+'"]').classList.toggle('hide', !show);
    if (!show) return;
    n++;
    const pin = document.createElement('div'); pin.className = 'pin m'; pin.style.left = c.ax + 'px'; pin.style.top = c.ay + 'px';
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'mk ' + c.kind + (c.stale && state.mode === 'price' ? ' stale' : '') + (state.sel === c.id ? ' on' : '');
    let tag, body;
    if (state.mode === 'price') { tag = c.pyeong; body = priceHTML(c); }
    else if (state.mode === 'units') { tag = KIND[c.kind]; body = c.units; }
    else { tag = KIND[c.kind]; body = c.yearShort; }
    b.innerHTML = '<span class="mk-tag">' + tag + '</span><span class="mk-body">' + body + '</span>';
    b.setAttribute('aria-label', c.name + ' ' + (c.price ? c.priceFull : '') + ' ' + c.priceNote);
    b.addEventListener('click', e => { e.stopPropagation(); select(c.id, true); });

  });
  document.getElementById('cnt').textContent = n;
}

const popLayer = document.getElementById('popLayer');

function select(id, pan) {

    '<div class="pop-btns"><button type="button" data-t="trade">실거래</button><button type="button" data-t="info">단지</button><button type="button" data-t="src">출처</button></div></div>';
  pin.querySelector('.pop').addEventListener('pointerdown', e => e.stopPropagation());
  pin.querySelector('.pop-h button').addEventListener('click', () => select(null));
  pin.querySelectorAll('.pop-btns button').forEach(b => b.addEventListener('click', () => openDetail(c.id, b.dataset.t)));

/* ---------- 상세 시트 ---------- */
const sheet = document.getElementById('sheet');
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function sheetShell(title, inner) {
  sheet.innerHTML = '<div class="sh-h"><h2>' + title + '</h2><button type="button" aria-label="닫기">×</button></div><div class="sh-c">' + inner + '</div>';
  sheet.querySelector('.sh-h button').addEventListener('click', closeSheet);
  sheet.hidden = false;
}
function closeSheet() { sheet.hidden = true; setPressed('btnCmp', false); setPressed('btnInfo', false); }
function openDetail(id, tab) {
  const c = byId(id);
  setPressed('btnCmp', false); setPressed('btnInfo', false);
  const head = c.kind === 'sale' ? '매매' : c.kind === 'plan' ? '공급' : ({'전':'전세','임':'보증금','호':'호가'}[c.prefix] || '임대');
  const tags = '<div class="tags"><span class="tag ' + c.kind + '">' + KIND[c.kind] + '</span><span class="tag">' + c.units + '</span><span class="tag">' +
    (c.year === '-' ? c.yearShort : c.year + ' 입주') + '</span>' + (c.stale ? '<span class="tag warn">2025년 거래 기준</span>' : '') + '</div>';
  const big = '<div class="big"><span class="lbl">' + esc(c.priceNote) + '</span><span class="val"><em>' + head + '</em>' + c.priceFull + '</span><span class="rng">' + esc(c.range) + '</span></div>';
  const tabs = '<div class="tabs" role="tablist">' + [['trade','실거래'],['info','단지정보'],['src','출처']].map(t =>
    '<button type="button" role="tab" data-t="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + '</button>').join('') + '</div><div id="tabBody"></div>';
  sheetShell(esc(c.name), tags + big + tabs);
  const body = sheet.querySelector('#tabBody');
  const draw = t => {
    sheet.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === t));
    if (t === 'trade') {
      body.innerHTML = c.trades.length
        ? '<div style="overflow-x:auto"><table><thead><tr><th>계약일</th><th>면적</th><th>층</th><th class="r">금액(만원)</th></tr></thead><tbody>' +
          c.trades.map(r => '<tr><td>' + r[0] + '</td><td>' + esc(r[1]) + '</td><td>' + r[2] + '</td><td class="r">' + r[3] + '</td></tr>').join('') + '</tbody></table></div>'
        : '<p class="empty">공개된 실거래 기록이 없습니다. ' + esc(c.priceNote) + '</p>';
      body.innerHTML += '<ul class="notes" style="margin-top:12px">' + c.notes.map(n => '<li>' + esc(n) + '</li>').join('') + '</ul>';
    } else if (t === 'info') {
      body.innerHTML = '<dl><dt>단지명</dt><dd>' + esc(c.name) + '</dd><dt>구분</dt><dd>' + KIND[c.kind] + '</dd><dt>규모</dt><dd>' + c.units + '</dd>' +
        '<dt>입주</dt><dd>' + (c.year === '-' ? '-' : c.year) + '</dd><dt>면적</dt><dd>' + esc(c.area) + '</dd><dt>표시 평형</dt><dd>' + c.pyeong + '</dd></dl>';
    } else {
      body.innerHTML = '<ul class="src">' + c.src.map(s => '<li>' + (s[1] ? '<a href="' + s[1] + '" target="_blank" rel="noopener">' + esc(s[0]) + '</a>' : esc(s[0])) + '</li>').join('') +
        '<li><a href="https://rt.molit.go.kr" target="_blank" rel="noopener">국토교통부 실거래가 공개시스템 (원자료 확인)</a></li></ul>';
    }
  };
  sheet.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => draw(b.dataset.t)));
  draw(tab || 'trade');
}
function openCompare() {
  const MAX = 7;
  const rows = [

    { id:'donga', v:4.5, lbl:'4.5억', sub:'33평 · 26.09 실거래' },
    { id:'seohan', v:4.37, lbl:'4.37억', sub:'38평 · 25.09 분양권' },
    { id:'hello', v:6.0, ext:1.0, lbl:'6억대', sub:'84㎡ · 공급 예정가' },

  const row = r => { const c = byId(r.id); return '<div class="cmp-row"><div class="cmp-name"><span>' + c.short.replace('\n', '') + ' <small>' + r.sub + '</small></span><b>' + r.lbl + '</b></div>' +

  const axis = '<div class="axis">' + [0,1,2,3,4,5,6,7].map(v => '<span>' + v + '억</span>').join('') + '</div>';
  sheetShell('주변 단지 가격 비교',

    '<div class="h3">매매 · 공급가</div><div class="cmp">' + rows.map(row).join('') + axis + '</div>' +
    '<div class="h3">민간임대 · 전세 · 보증금</div><div class="cmp">' + rent.map(row).join('') + axis + '</div>' +
    '<ul class="notes"><li>빗금 구간은 가격 범위 (예: 6억대 = 6억 이상 7억 미만)</li><li>서한이다음 노블리스는 2026년 실거래가 확인되지 않아 2025년 분양권 거래로 표시</li><li>제일풍경채 오송은 공개 거래 자료가 없어 제외</li></ul>');
  setPressed('btnCmp', true); setPressed('btnInfo', false);
}
function openInfo() {
  sheetShell('자료 안내',
    '<div class="tags"><span class="tag">기준일 2026.10.14</span><span class="tag">웹 공개자료 수집</span></div>' +
    '<ul class="notes">' +
    '<li>실거래가는 국토교통부 실거래가 공개 자료를 재가공한 민간 서비스(호갱노노·리치고·KB부동산·집순위 등)에서 확인한 값입니다. 계약일·금액은 서비스마다 하루 이틀 차이가 날 수 있습니다.</li>' +

    '<li>오송역 헬로우시티 가격은 조합원 모집 자료의 공급 예정가이며 시세가 아닙니다. 변경될 수 있습니다.</li>' +
    '<li>바탕 지도는 브리핑용 개략도입니다. 도로·철도·단지 위치와 크기는 실제와 다를 수 있습니다.</li>' +
    '<li>고객 안내 전 국토교통부 실거래가 공개시스템에서 최신 거래를 다시 확인하세요.</li></ul>' +
    '<ul class="src"><li><a href="https://rt.molit.go.kr" target="_blank" rel="noopener">국토교통부 실거래가 공개시스템</a></li></ul>' +
    '<p class="pop-note" style="margin:0">단지별 출처는 마커를 누른 뒤 <b>출처</b> 탭에서 볼 수 있습니다.</p>');
  setPressed('btnInfo', true); setPressed('btnCmp', false);

function setPressed(id, v) { document.getElementById(id).setAttribute('aria-pressed', v); }

/* ---------- 팬 / 줌 ---------- */
const map = document.getElementById('map'), world = document.getElementById('world');
const V = { k:1, tx:0, ty:0, min:0.12, max:3 };
const clamp = k => Math.min(V.max, Math.max(V.min, k));
function apply(anim) {
  world.style.transition = anim ? 'transform .3s ease' : 'none';
  world.style.transform = 'translate(' + V.tx + 'px,' + V.ty + 'px) scale(' + V.k + ')';
  world.style.setProperty('--inv', (1 / V.k).toFixed(4));
  world.classList.toggle('far', V.k < 0.5);
}
function zoomAt(px, py, f, anim) { const k = clamp(V.k * f); V.tx = px - (px - V.tx) * (k / V.k); V.ty = py - (py - V.ty) * (k / V.k); V.k = k; apply(anim); }
function fit(anim) {
  const r = map.getBoundingClientRect();
  const narrow = r.width < 700;
  document.getElementById('app').classList.toggle('narrow', narrow);
  const b = narrow ? [110, 170, 1350, 920] : [90, 90, 1520, 1000];
  const padT = 70, padB = 100, padX = narrow ? 8 : 70;
  const k = clamp(Math.min((r.width - padX * 2) / (b[2] - b[0]), (r.height - padT - padB) / (b[3] - b[1])));
  V.k = k; V.tx = r.width / 2 - (b[0] + b[2]) / 2 * k; V.ty = padT + (r.height - padT - padB) / 2 - (b[1] + b[3]) / 2 * k;
  apply(anim);
}
function ensureVisible(x, y) {
  const r = map.getBoundingClientRect();
  const sx = V.tx + x * V.k, sy = V.ty + y * V.k;
  const sheetW = (!sheet.hidden && r.width >= 700) ? 380 : 0;
  const minX = 140 + sheetW, maxX = r.width - 140, minY = 300, maxY = r.height - 120;
  let dx = 0, dy = 0;
  if (sx < minX) dx = minX - sx; else if (sx > maxX) dx = maxX - sx;
  if (sy < minY) dy = minY - sy; else if (sy > maxY) dy = maxY - sy;
  if (dx || dy) { V.tx += dx; V.ty += dy; apply(true); }
}
const ptrs = new Map(); let moved = 0, pinch = null;
map.addEventListener('pointerdown', e => {
  if (e.target.closest('.mk, .pop')) return;
  map.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY }); moved = 0;
  map.classList.add('drag');
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d:Math.hypot(a.x - b.x, a.y - b.y) }; }
});
map.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); const cur = { x:e.clientX, y:e.clientY }; ptrs.set(e.pointerId, cur);
  if (ptrs.size === 1) { V.tx += cur.x - prev.x; V.ty += cur.y - prev.y; moved += Math.abs(cur.x - prev.x) + Math.abs(cur.y - prev.y); apply(false); }
  else if (ptrs.size === 2 && pinch) {
    const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); const r = map.getBoundingClientRect();
    zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, d / pinch.d, false); pinch.d = d; moved += 10;
  }
});
const endPtr = e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null;
  if (!ptrs.size) { map.classList.remove('drag'); if (moved < 5 && e.type === 'pointerup') select(null); }
};
map.addEventListener('pointerup', endPtr); map.addEventListener('pointercancel', endPtr);
map.addEventListener('wheel', e => { e.preventDefault(); const r = map.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015), false); }, { passive:false });
const center = () => { const r = map.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
document.getElementById('zin').addEventListener('click', () => zoomAt(...center(), 1.4, true));
document.getElementById('zout').addEventListener('click', () => zoomAt(...center(), 1 / 1.4, true));
document.getElementById('zfit').addEventListener('click', () => fit(true));
addEventListener('resize', () => fit(false));

/* ---------- 컨트롤 ---------- */
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  state.filter = b.dataset.f;
  if (state.sel && state.filter !== 'all' && byId(state.sel).kind !== state.filter) select(null); else renderMarkers();
}));
document.getElementById('mode').addEventListener('change', e => { state.mode = e.target.value; renderMarkers(); });
document.getElementById('btnCmp').addEventListener('click', e => e.currentTarget.getAttribute('aria-pressed') === 'true' ? closeSheet() : openCompare());
document.getElementById('btnInfo').addEventListener('click', e => e.currentTarget.getAttribute('aria-pressed') === 'true' ? closeSheet() : openInfo());
document.getElementById('btnEdu').addEventListener('click', e => { const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; setPressed('btnEdu', on); document.getElementById('app').classList.toggle('edu-off', !on); });
document.getElementById('btnDev').addEventListener('click', e => { const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; setPressed('btnDev', on); document.getElementById('zoneG').classList.toggle('zone-on', on); if (on) ensureVisible(1320, 720); });

renderMarkers();
fit(false);
if (map.getBoundingClientRect().width >= 700) select('hello', false); else { areaEl.hello.classList.add('sel'); }
})();
